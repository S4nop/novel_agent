[project]
name = "novel-agent"
version = "0.0.1"
description = "AI agent that writes serialized Korean web novels (웹소설). See DESIGN.md."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Deferred until the LLM nodes are built (Phase 1a graph). The deterministic
# core (artifacts, canon store, ledgers, context pack) needs only pydantic.
llm = [
    "google-genai>=1.0",       # provider=gemini (native: safety settings, responseSchema)
    "openai>=1.40",            # provider=openai (any compatible endpoint)
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
orchestration = [               # deferred: the LangGraph episode loop (DESIGN §5)
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "structlog>=24.1",
]
dev = ["pytest>=8.0", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
